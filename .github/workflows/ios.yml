name: iOS CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "10"
      SCAN_DEVICES: iPhone 16e
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Ensure temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP"
          echo "TMPDIR=$RUNNER_TEMP"
          ls -ld "$RUNNER_TEMP"

      - name: Create xcconfig (CI)
        env:
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          API_CLIENT_KEY: ${{ secrets.API_CLIENT_KEY }}
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          cat > MyBusMapSwiftUI/Config.local.xcconfig <<EOF
          API_CLIENT_ID = ${API_CLIENT_ID:-ci}
          API_CLIENT_KEY = ${API_CLIENT_KEY:-ci}
          GMS_API_KEY = ${GMS_API_KEY:-ci}
          EOF

      - name: Run tests (fastlane)
        run: bundle exec fastlane ios ci

  beta:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release') && (contains(github.event.head_commit.message, 'beta') || contains(github.event.head_commit.message, 'Beta') || contains(github.event.head_commit.message, 'BETA') || contains(github.event.head_commit.message, 'RELEASE')))
    runs-on: macos-latest
    needs: test
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "10"
      SCAN_DEVICES: iPhone 16e
      HAS_MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Ensure temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP"
          echo "TMPDIR=$RUNNER_TEMP"
          ls -ld "$RUNNER_TEMP"

      - name: Create xcconfig (CI)
        env:
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          API_CLIENT_KEY: ${{ secrets.API_CLIENT_KEY }}
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          cat > MyBusMapSwiftUI/Config.local.xcconfig <<EOF
          API_CLIENT_ID = ${API_CLIENT_ID:-ci}
          API_CLIENT_KEY = ${API_CLIENT_KEY:-ci}
          GMS_API_KEY = ${GMS_API_KEY:-ci}
          EOF

      - name: Setup SSH for match repo (optional)
        if: ${{ env.HAS_MATCH_GIT_PRIVATE_KEY == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key (optional)
        if: ${{ env.HAS_MATCH_GIT_PRIVATE_KEY == 'true' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Create App Store Connect API key file (p8)
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p fastlane/tmp
          pem="$(printf '%b' "$ASC_KEY_CONTENT")"

          if printf '%s' "$pem" | grep -q "BEGIN PRIVATE KEY"; then
            if printf '%s' "$pem" | grep -q $'\\n'; then
              printf '%s\n' "$pem" > fastlane/tmp/AuthKey.p8
            else
              body="$(printf '%s' "$pem" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//')"
              body="$(printf '%s' "$body" | tr -d ' \t\r\n')"
              {
                echo "-----BEGIN PRIVATE KEY-----"
                echo "$body" | fold -w 64
                echo "-----END PRIVATE KEY-----"
              } > fastlane/tmp/AuthKey.p8
            fi
          else
            b64="$(printf '%s' "$ASC_KEY_CONTENT" | tr -d ' \t\r\n')"
            if printf '%s' "$b64" | base64 -D > fastlane/tmp/AuthKey.p8 2>/dev/null; then
              :
            elif printf '%s' "$b64" | base64 --decode > fastlane/tmp/AuthKey.p8 2>/dev/null; then
              :
            else
              echo "::error::ASC_KEY_CONTENT is neither a PEM (.p8) nor valid base64."
              exit 1
            fi
          fi
          head -n 1 fastlane/tmp/AuthKey.p8 | grep -q "BEGIN PRIVATE KEY"
          echo "ASC_KEY_PATH=$PWD/fastlane/tmp/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Upload TestFlight (fastlane)
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane ios beta
