name: iOS CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "10"
      SCAN_DEVICES: iPhone 16e
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Ensure temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP"
          echo "TMPDIR=$RUNNER_TEMP"
          ls -ld "$RUNNER_TEMP"

      - name: Create xcconfig (CI)
        env:
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          API_CLIENT_KEY: ${{ secrets.API_CLIENT_KEY }}
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          cat > MyBusMapSwiftUI/Config.local.xcconfig <<EOF
          API_CLIENT_ID = ${API_CLIENT_ID:-ci}
          API_CLIENT_KEY = ${API_CLIENT_KEY:-ci}
          GMS_API_KEY = ${GMS_API_KEY:-ci}
          EOF

      - name: Run tests (fastlane)
        run: bundle exec fastlane ios ci

  beta:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: test
    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "60"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "10"
      SCAN_DEVICES: iPhone 16e
      HAS_MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Ensure temp directories
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP"
          echo "TMPDIR=$RUNNER_TEMP"
          ls -ld "$RUNNER_TEMP"

      - name: Create xcconfig (CI)
        env:
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          API_CLIENT_KEY: ${{ secrets.API_CLIENT_KEY }}
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
        run: |
          cat > MyBusMapSwiftUI/Config.local.xcconfig <<EOF
          API_CLIENT_ID = ${API_CLIENT_ID:-ci}
          API_CLIENT_KEY = ${API_CLIENT_KEY:-ci}
          GMS_API_KEY = ${GMS_API_KEY:-ci}
          EOF

      - name: Setup SSH for match repo (optional)
        if: ${{ env.HAS_MATCH_GIT_PRIVATE_KEY == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Trust GitHub host key (optional)
        if: ${{ env.HAS_MATCH_GIT_PRIVATE_KEY == 'true' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Create App Store Connect API key file (p8)
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p fastlane/tmp
          if echo "$ASC_KEY_CONTENT" | grep -q "BEGIN PRIVATE KEY"; then
            printf "%s" "$ASC_KEY_CONTENT" > fastlane/tmp/AuthKey.p8
          else
            printf "%s" "$ASC_KEY_CONTENT" | tr -d '\r\n' | base64 -D > fastlane/tmp/AuthKey.p8
          fi
          head -n 1 fastlane/tmp/AuthKey.p8 | grep -q "BEGIN PRIVATE KEY"
          echo "ASC_KEY_PATH=$PWD/fastlane/tmp/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Upload TestFlight (fastlane)
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane ios beta
